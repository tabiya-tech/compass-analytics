name: Backend CI

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Poetry install
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-0

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: venv-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction
        working-directory: backend

      - name: Security scan
        run: poetry run bandit -c bandit.yaml -r .
        working-directory: backend

      - name: Lint
        run: poetry run pylint --exit-zero --recursive=y .
        working-directory: backend

      - name: Test
        run: poetry run pytest -m "not smoke_test"
        working-directory: backend

      - name: Build Docker image
        run: docker build -t compass-analytics-backend:${{ github.sha }} .
        working-directory: backend
