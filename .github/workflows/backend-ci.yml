name: Backend CI & Artifact Upload

on:
  workflow_call:
    inputs:
      upload-artifacts:
        required: true
        type: boolean
        description: 'Whether to build and upload the Docker image to Artifact Registry'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Poetry install
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-0

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: venv-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction
        working-directory: backend

      - name: Security scan
        run: poetry run bandit -c bandit.yaml -r .
        working-directory: backend

      - name: Lint
        run: poetry run pylint --exit-zero --recursive=y .
        working-directory: backend

      - name: Test
        run: poetry run pytest -m "not smoke_test"
        working-directory: backend

  build-and-upload:
    runs-on: ubuntu-latest
    if: ${{ inputs.upload-artifacts }}
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_LOWER }}
          service_account: ${{ vars.DEPLOY_SA_LOWER }}

      - name: Run build and upload script
        shell: bash
        run: |
          ./iac/scripts/build-and-upload-be.sh \
            ${{ vars.ARTIFACT_REGISTRY_REGION }} \
            ${{ vars.GCP_REALM_ROOT_PROJECT_ID }} \
            $GITHUB_STEP_SUMMARY \
            $GITHUB_RUN_NUMBER
