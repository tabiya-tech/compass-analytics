name: Main CI
on:
  push:
    branches:
      - "**" # Runs on push to any branch

# only one job should run at a time when deploying
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    uses: ./.github/workflows/frontend-ci.yml

  backend-ci:
    uses: ./.github/workflows/backend-ci.yml

  # NOTE: iac is not implemented yet. Add a deploy.yml (see the
  # taxonomy-model-application and compass repos for reference shapes) and
  # wire it in here once that subproject exists.
