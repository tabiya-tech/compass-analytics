name: Main CI
on:
  push:
    branches:
      - "**" # Runs on push to any branch

# only one job should run at a time when deploying
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    uses: ./.github/workflows/frontend-ci.yml

  # NOTE: backend and iac are not implemented yet. Add a backend-ci.yml /
  # deploy.yml (see the taxonomy-model-application and compass repos for
  # reference shapes) and wire them in here once those subprojects exist.
