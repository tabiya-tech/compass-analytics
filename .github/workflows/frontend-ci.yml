name: Frontend CI

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install node packages
        run: yarn install --frozen-lockfile
        working-directory: frontend

      - name: Check Format
        run: yarn run format:check
        working-directory: frontend

      - name: Lint
        run: yarn run lint
        working-directory: frontend

      - name: Compile
        run: yarn run compile
        working-directory: frontend

      - name: Unit tests
        run: yarn run test
        working-directory: frontend

      - name: Storybook tests
        run: npx playwright install --with-deps chromium && yarn run test:storybook
        working-directory: frontend

      - name: Build
        run: yarn run build
        working-directory: frontend

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-v1
          restore-keys: playwright-browsers-${{ runner.os }}-

      - name: Install node packages
        run: yarn install --frozen-lockfile
        working-directory: frontend

      - name: Accessibility tests
        run: npx playwright install --with-deps chromium && yarn run test:accessibility
        working-directory: frontend
