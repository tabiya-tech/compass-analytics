[project]
name = "compass-analytics-backend"
version = "0.0.0"
description = "Compass Analytics backend API"
authors = [
    { name = "Tabiya", email = "tabiya@tabiya.org" },
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.139.2,<0.140.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "motor (>=3.7.1,<4.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "sentry-sdk[fastapi] (>=2.66.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "google-auth (>=2.0.0,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
]

[tool.poetry]
packages = [
    { include = "app" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-mock = "^3.15.1"
pytest-repeat = "^0.9.4"
bandit = "^1.9.4"
pylint = "^4.0.6"
pylint-pydantic = "^0.4.1"
pymongo_inmemory = "^0.5.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
